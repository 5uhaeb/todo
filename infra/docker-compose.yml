version: '3.9'
services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  backend:
    build: ../backend
    container_name: backend
    ports:
      - "5000:5000"
    env_file:
      - ../backend/.env
    depends_on:
      - redis

  frontend:
    build: ../frontend
    container_name: frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
